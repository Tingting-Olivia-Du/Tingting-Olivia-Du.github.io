# Local development overrides.
#
# The theme builds asset URLs from `site.url`, so without this a local preview
# silently loads the *published* CSS/JS instead of your working copy. Serve with:
#
#   bundle exec jekyll serve --config _config.yml,_config.dev.yml
#
# Browse via http://localhost:PORT, not 127.0.0.1: `jekyll serve` rewrites asset
# URLs to localhost, and the mismatched origin makes the browser treat the icon
# webfonts as cross-origin and refuse them (icons render as empty boxes).
url: "http://127.0.0.1:4000"
